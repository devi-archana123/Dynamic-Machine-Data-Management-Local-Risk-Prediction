<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Machine</title>
</head>
<body>
    <h1>Add Machine</h1>

    <form method="POST">

        {% for field in fields %}

            <label>
                {{ field.field_name }}
            </label>

            <br>

            {% if field.field_type == "text" %}

                <input
                    type="text"
                    name="{{ field.field_name }}"
                    {% if field.required %}required{% endif %}
                >

            {% elif field.field_type == "number" %}

                <input
                    type="number"
                    name="{{ field.field_name }}"
                    {% if field.required %}required{% endif %}
                >

            {% elif field.field_type == "dropdown" %}

                <select
                    name="{{ field.field_name }}"
                    {% if field.required %}required{% endif %}
                >

                    {% for option in field.options.split(",") %}

                        <option value="{{ option }}">
                            {{ option }}
                        </option>

                    {% endfor %}

                </select>

            {% endif %}

            <br><br>

        {% endfor %}

        <button type="submit">
            Save Machine
        </button>

    </form>

    <br>

    <a href="/machines">
        Back to Machines
    </a>

</body>
</html>
